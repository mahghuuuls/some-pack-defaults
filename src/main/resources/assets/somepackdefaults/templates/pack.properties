# Some Pack Defaults: the PACK file. The pack maker edits it and ships it with the pack.
# Players do not edit this file; they edit player.properties. Never ship player.properties with the pack.
#
# Every line here is set at every server start and every singleplayer world open.
# A line here wins over the same line in player.properties.
# Write each line as name=value: server lines as in server.properties, gamerules by their name.
# Only vanilla Minecraft 1.12.2 server lines. level-name belongs in suggestions.properties.
# server-ip, server-port, enable-rcon, rcon.port, rcon.password, enable-query and query.port
# belong to the server admin and are refused.
# Remove the # at the start of a line to use it.
#
# Server lines (dedicated server only):
#allow-flight=true
#allow-nether=true
#pvp=true
#enable-command-block=false
#spawn-animals=true
#spawn-monsters=true
#spawn-npcs=true
#max-tick-time=60000
#resource-pack=
#resource-pack-sha1=
#
# Gamerules (every world):
#doDaylightCycle=true
#doWeatherCycle=true
#doMobSpawning=true
#doLimitedCrafting=false
#randomTickSpeed=3
#maxEntityCramming=24
#disableElytraMovementCheck=false
