## Some Pack Defaults: SUGGESTIONS. The pack maker edits this file and ships it with the pack.
## Players do not edit this file; they edit player.properties. Never ship player.properties with the pack.
##
## When player.properties is missing, the mod makes it from this file, once.
## Lines that start with ## (like this one) are notes for the pack maker and are not copied.
## A change here reaches only players who do not have player.properties yet.
## Write lines as in pack.properties; level-name may be here.
## Remove the # at the start of a line to make it active in new player files;
## a line that keeps its # is copied as an example the player can turn on.
##
# World (dedicated server only; level-name picks the world folder,
# the other lines are used only when the server makes a new world):
#level-name=world
#level-seed=
#level-type=DEFAULT
#generator-settings=
#generate-structures=true
#
# Server lines (dedicated server only):
# difficulty: 0 peaceful, 1 easy, 2 normal, 3 hard. gamemode: 0 survival, 1 creative, 2 adventure, 3 spectator.
#motd=A Minecraft Server
#difficulty=1
#gamemode=0
#max-players=20
#view-distance=10
#spawn-protection=16
#
# Gamerules (every world):
#keepInventory=false
#naturalRegeneration=true
#mobGriefing=true
#doFireTick=true
#showDeathMessages=true
#announceAdvancements=true
#spawnRadius=10
