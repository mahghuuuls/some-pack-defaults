# Some Pack Defaults: gamerules set again at EVERY server start and every singleplayer world open.
# A change made with /gamerule lasts until the next start or world open.
#
# Write each line as name=value: an existing gamerule, with true or false for on/off rules and a whole number for number rules.
# Lines starting with # are ignored. A gamerule may not also be in gamerules-default.properties.
#
# Example:
#doDaylightCycle=false
