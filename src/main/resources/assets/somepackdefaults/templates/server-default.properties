# Some Pack Defaults: server lines for a NEW dedicated server only.
# They are written to server.properties at the server's first start and never again,
# so the server admin's later changes stay.
#
# Write each line as in server.properties: name=value. Lines starting with # are ignored.
# Only vanilla Minecraft 1.12.2 lines. server-ip, server-port, enable-rcon, rcon.port,
# rcon.password, enable-query and query.port belong to the server admin and are refused.
# A line may not also be in server-reapply.properties.
#
# Example:
#motd=My Pack Server
