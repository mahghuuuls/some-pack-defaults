# Some Pack Defaults: gamerules for NEW worlds only (singleplayer and dedicated server).
# They are set once, when the world is created, so later changes in the world stay.
#
# Write each line as name=value: an existing gamerule, with true or false for on/off rules and a whole number for number rules.
# Lines starting with # are ignored. A gamerule may not also be in gamerules-reapply.properties.
#
# Example:
#keepInventory=true
